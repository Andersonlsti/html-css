<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Boxes</title>
    <style>
        div.container {
            background-color: green;
            border: 5px solid red;
            display: flex;
            width: 90vw;
        }

        div.itens {
            background-color: blue;
            border: 3px solid purple;
            text-align: center;
        }

        div#a {
            /*shorthand de flex
            flex: grow shrink basis*/
            flex: 0 2 250px;
        }

        div#b {
            flex: 1 1 250px;
        }

        div#c {
            flex: 2 0 250px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="itens" id="a">A</div>
        <div class="itens" id="b">B</div>
        <div class="itens" id="c">C</div>
    </div>
</body>
</html>
