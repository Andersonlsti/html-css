<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Boxes</title>
    <style>
        div.container {
            background-color: green;
            border: 5px solid red;
            display: flex;
        }

        div.itens {
            background-color: blue;
            border: 3px solid purple;
            text-align: center;
            padding: 20px;
        }

        div#i1 {
            order: 5;
        }

        div#i2 {
            order: 9;
        }

        div#i3 {
            order: 7;
        }

        div#i4 {
            order: 1;
        }

        div#i5 {
            order: 3;
        }

        div#i6 {
            order: -4;
        }

        div#i7 {
            order: -2;
        }

        div#i8 {
            order: -4;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="itens" id="i1">A</div>
        <div class="itens" id="i2">B</div>
        <div class="itens" id="i3">C</div>
        <div class="itens" id="i4">D</div>
        <div class="itens" id="i5">E</div>
        <div class="itens" id="i6">F</div>
        <div class="itens" id="i7">G</div>
        <div class="itens" id="i8">H</div>
    </div>
</body>
</html>
