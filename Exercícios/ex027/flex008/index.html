<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Boxes</title>
    <style>
        div.container {
            background-color: green;
            border: 5px solid red;
            display: flex;
            height: 400px;
        }

        div.itens {
            background-color: blue;
            border: 3px solid purple;
            text-align: center;
            padding: 20px;
        }

        div#i1 {
            align-self: auto;
            /*herda a configuração estabelecida no pai assim como inherit*/
        }

        div#i2 {
            align-self: inherit;
            /*herda a configuração estabelecida no pai assim como auto*/
        }

        div#i3 {
            align-self: flex-start;
            /*fixa no Cross Start*/
        }

        div#i4 {
            align-self: flex-end;
            /*fixa no Cross End*/
        }

        div#i5 {
            align-self: center;
            /*alinha ao centro do Cross*/
        }

        div#i6 {
            align-self: stretch;
            /*Estica até o fim do Cross (configuração padrão)*/
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="itens" id="i1">A</div>
        <div class="itens" id="i2">B</div>
        <div class="itens" id="i3">C</div>
        <div class="itens" id="i4">D</div>
        <div class="itens" id="i5">E</div>
        <div class="itens" id="i6">F</div>
        <div class="itens" id="i7">G</div>
        <div class="itens" id="i8">H</div>
    </div>
</body>
</html>
