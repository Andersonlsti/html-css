<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de grid</title>
    <style>
        div.container {
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(4, 1fr);
        }

        div.cx1 {
            background-color: red;
            grid-row: 1;
            grid-column: 1 / -1;
        }

        div.cx2 {
            background-color: green;
            grid-row: 2 / -1;
            grid-column: 1 / 3;
        }

        div.cx3 {
            background-color: blue;
            grid-row: 2 / -1;
            grid-column: 3 / -1;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="cx1">Caixa 1</div>
        <div class="cx2">Caixa 2</div>
        <div class="cx3">Caixa 3</div>
    </div>
</body>
</html>
