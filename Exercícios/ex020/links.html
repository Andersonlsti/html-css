<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*Seletores Personalizados
        #  = id
        .  = class
        :  = pseudo-class
        :: = pseudo-element
        >  = Children
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: yellow;
        }

        .especial {
            background-color: rgb(255, 140, 140);
        }

        .especial::before {
            content: '=> ';
        }

        .especial::after {
            content: ' <=';
        }
    </style>
</head>
<body>
    <h1>Prersonalizando Links</h1>
    <ul>
        <li><a href="https://www.google.com" target="_blank" class="especial">Site do Google</a></li>
        <li><a href="https://www.youtube.com" target="_blank" class="especial">Site do Youtube</a></li>
        <li><a href="https://www.instagram.com" target="_blank" class="especial">Site do Instagram</a></li>
    </ul>
</body>
</html>
